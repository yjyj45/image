        h('div', { class: 'vis-grid' }, slotEls)),
      h('div', { class: 'field' },
        h('div', { class: 'stephead' }, h('b', {}, '②'), h('span', {}, '낱말을 보고 외형을 문장으로 써요'),
          h('small', { class: 'hint2' }, '낱말을 이어서 모둠이 함께 써요.'),
          exampleBox(['주인공은 열한 살 여자아이예요.', '머리는 갈색 긴 머리예요.', '노란 티셔츠, 청바지를 입고 있어요.'])),
        kwBox),
      fixed,
      h('div', { class: 'notice' }, '유명 캐릭터나 작가의 이름, 실제 사람의 사진은 쓰지 않아요.'));
  }

  function step2El() {
    promptRefs = [];
    var left = state.pool.filter(function (c) { return c.text.trim(); }).length;
    var common = lookPanel(false);
    var items = [];
    if (isMine(state.cover)) items.push(visualEl(state.cover, '표지', h('blockquote', { class: 'quote' }, state.title ? '제목: ' + state.title : '제목이 아직 없어요.'), false));
    state.pages.forEach(function (p, i) {
      if (!isMine(p)) return;
      var text = p.cards.map(function (c) { return c.text.trim(); }).filter(Boolean).join(' ');
      items.push(visualEl(p, (i + 1) + '쪽',
        h('blockquote', { class: 'quote' + (text ? '' : ' empty') }, text || '이 쪽에는 아직 글이 없어요. 쪽 나누기에서 글 카드를 넣어 보세요.'), p.star));
    });

    return h('div', { class: 'wrap', style: 'gap:14px' },
      left ? h('div', { class: 'notice warn' }, '아직 넣지 않은 글이 ' + left + '개 있어요. 쪽 나누기에서 확인해 보세요.') : null,
      mineBar(),
      common,
      h('details', { class: 'help' }, h('summary', {}, em('💡'), '이미지 프롬프트는 이렇게 써요'),
        h('ul', {},
          h('li', {}, '프롬프트는 AI에게 \u201c이런 그림을 그려 줘\u201d 하고 알려 주는 말이에요.'),
          h('li', {}, '자세히 쓸수록 내가 생각한 그림과 비슷해져요.'),
          h('li', {}, '이런 것을 알려 주면 좋아요: 누가 무엇을 하는지(장면·표정) / 어디인지(배경) / 어떤 느낌인지(분위기) / 어떻게 보이는지(구도) / 어떤 그림체인지(스타일). 낱말만 쓰지 말고 문장으로 설명해요.'),
          h('li', {}, '아쉬운 글: \u201c방, 거울, 노란빛, 수채화\u201d처럼 낱말만 늘어놓아요.'),
          h('li', {}, '좋은 글: \u201c아늑한 방에서 한 여자아이가 거울 앞에 서서 대본을 읽고 있어요. 따뜻한 느낌이에요.\u201d'),
          h('li', {}, 'AI는 손이나 글자를 어색하게 그릴 때가 많아요. 그림을 꼭 살펴봐요.'))),
      h('div', { class: 'toolbar' }, h('span', { class: 'chip' }, state.mine ? state.mine + '번 담당 ' + items.length + '장' : '그림 ' + items.length + '장 (표지 포함)')),
      h('div', { class: 'vis-list' }, items));
  }

  function updateMeta() {
    var n = state.pages.length;
    var left = state.pool.filter(function (c) { return c.text.trim(); }).length;
    var cp = document.getElementById('chip-pages'), cl = document.getElementById('chip-pool');
    if (cp) {
      cp.textContent = '본문 ' + n + '쪽 · 알맞은 쪽 수 ' + TARGET_MIN + '~' + TARGET_MAX + '쪽';
      cp.className = 'chip ' + (n >= TARGET_MIN && n <= TARGET_MAX ? 'good' : '');
    }
    if (cl) {
      cl.textContent = left ? '아직 넣지 않은 글 ' + left + '개' : hasAnyText() ? '모든 글을 넣었어요' : '아직 글이 없어요';
      cl.className = 'chip ' + (left ? 'warn' : hasAnyText() ? 'good' : '');
    }
    var t = document.getElementById('cover-title'), by = document.getElementById('cover-by');
    if (t) t.textContent = state.title || '(제목을 정해 보세요)';
    if (by) by.textContent = '지은이: ' + (state.group || '우리 모둠');
    state.pages.forEach(function (p) {
      var hint = document.querySelector('[data-hint="' + p.id + '"]');
      if (!hint) return;
      var chars = p.cards.reduce(function (s, c) { return s + c.text.length; }, 0);
      hint.hidden = !(p.cards.length >= 4 || chars > 150);
    });
  }

  function render() {
    var app = document.getElementById('app');
    var tb = toolbarEl();
    var parts = [headerEl()];
    if (state.step === 3) parts.push(step3El()); else if (state.step === 2) parts.push(step2El()); else parts.push(loaderEl(), tb.top, mainEl(), lookPanel(true));
    parts.push(tb.bottom);
    if (state.step === 1) {
      parts.push(memberPasteEl());
      parts.push(h('div', { class: 'row', style: 'justify-content:flex-end' }, h('button', { class: 'btn primary', type: 'button', onclick: function () { goStep(2); } }, '다음: 장면과 프롬프트 →')));
    }
    app.replaceChildren.apply(app, parts);
    requestAnimationFrame(function () { document.querySelectorAll('textarea.txt, textarea.prompt, textarea.look').forEach(autosize); });
    updateMeta();
  }

  function loadExample() {
    var r = fromSix(parseSections(EXAMPLE));
    r.st.isExample = true;
    return r.st;
  }

  /* ---------- 끌어 놓기(마우스·터치 모두) ---------- */
  var drag = null;
  document.addEventListener('pointerdown', function (e) {
    var grip = e.target.closest && e.target.closest('.grip, .page-grip');
    if (!grip || (e.pointerType === 'mouse' && e.button !== 0)) return;
    var isPage = grip.classList.contains('page-grip');
    var cardNode = grip.closest(isPage ? '.page' : '.card');
    if (!cardNode) return;
    e.preventDefault();
    var f = isPage ? null : findCard(cardNode.dataset.id);
    var rect = cardNode.getBoundingClientRect();
    var label = isPage ? cardNode.querySelector('h3').textContent + ' 옮기는 중' : ((f && f.list[f.i].text.trim()) || '(빈 카드)');
    var ghost = h('div', { class: 'ghost' }, label);
    ghost.style.width = isPage ? 'auto' : Math.min(rect.width, 320) + 'px';
    document.body.appendChild(ghost);
    drag = { kind: isPage ? 'page' : 'card', id: isPage ? cardNode.dataset.page : cardNode.dataset.id, node: cardNode, ghost: ghost, offX: Math.min(e.clientX - rect.left, 40), offY: 18, x: e.clientX, y: e.clientY, target: null };
    cardNode.classList.add('is-dragging');
    document.body.classList.add('dragging');
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    place(); loop();
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY; place(); locate();
  });
  document.addEventListener('pointerup', function () { finish(true); });
  document.addEventListener('pointercancel', function () { finish(false); });

  function place() {
    if (!drag) return;
    drag.ghost.style.left = (drag.x - drag.offX) + 'px';
    drag.ghost.style.top = (drag.y - drag.offY) + 'px';
  }
  function clearMarks() {
    document.querySelectorAll('.drop-line').forEach(function (n) { n.remove(); });
    document.querySelectorAll('.over').forEach(function (n) { n.classList.remove('over'); });
    document.querySelectorAll('.mark').forEach(function (n) { n.classList.remove('mark', 'mark-before-x', 'mark-after-x', 'mark-before-y', 'mark-after-y'); });
  }
  function locatePage(el) {
    var every = Array.prototype.slice.call(document.querySelectorAll('.page[data-page]'));
    var others = every.filter(function (n) { return n !== drag.node; });
    var add = el.closest('.add-tile');
    if (add) { add.classList.add('mark', 'mark-before-y'); drag.target = { idx: others.length }; return; }
    var pg = el.closest('.page[data-page]');
    if (!pg || pg === drag.node) return;
    var r = pg.getBoundingClientRect();
    var sameRow = every.some(function (n) { return n !== pg && Math.abs(n.getBoundingClientRect().top - r.top) < 6; });
    var before = sameRow ? drag.x < r.left + r.width / 2 : drag.y < r.top + r.height / 2;
    pg.classList.add('mark', 'mark-' + (before ? 'before' : 'after') + '-' + (sameRow ? 'x' : 'y'));
    drag.target = { idx: others.indexOf(pg) + (before ? 0 : 1) };
  }
  function movePageTo(id, idx) {
    var i = state.pages.findIndex(function (p) { return p.id === id; });
    if (i < 0) return;
    var p = state.pages.splice(i, 1)[0];
    state.pages.splice(Math.min(idx, state.pages.length), 0, p);
    save(); render();
  }
  function locate() {
    clearMarks();
    drag.target = null;
    var el = document.elementFromPoint(drag.x, drag.y);
    if (!el) return;
    if (drag.kind === 'page') { locatePage(el); return; }
    var holder = el.closest('[data-holder]');
    if (!holder) return;
    var zone = holder.querySelector('[data-zone]');
    if (!zone) return;
    var cards = Array.prototype.slice.call(zone.querySelectorAll('.card:not(.is-dragging)'));
    var idx = cards.findIndex(function (c) { var r = c.getBoundingClientRect(); return drag.y < r.top + r.height / 2; });
    if (idx < 0) idx = cards.length;
    var line = h('div', { class: 'drop-line' });
    if (idx < cards.length) zone.insertBefore(line, cards[idx]); else zone.appendChild(line);
    holder.classList.add('over'); zone.classList.add('over');
    drag.target = { key: zone.dataset.zone, idx: idx };
  }
  function loop() {
    if (!drag) return;
    if (drag.y < 80) window.scrollBy(0, -14);
    else if (drag.y > window.innerHeight - 80) window.scrollBy(0, 14);
    locate();
    requestAnimationFrame(loop);
  }
  function finish(drop) {
    if (!drag) return;
    var d = drag; drag = null;
    clearMarks();
    d.ghost.remove();
    d.node.classList.remove('is-dragging');
    document.body.classList.remove('dragging');
    if (drop && d.target) {
      if (d.kind === 'page') movePageTo(d.id, d.target.idx);
      else moveCard(d.id, d.target.key, d.target.idx);
    }
  }
  window.addEventListener('resize', function () { document.querySelectorAll('textarea.txt, textarea.prompt, textarea.look').forEach(autosize); });

  /* ---------- 시작 ---------- */
  state = load() || blankState();
  (function takeCodeFromLink() {
    var m = /[#&]c=([^&]+)/.exec(location.hash || '');
    if (!m) return;
    var c = '';
    c = m[1]; try { c = decodeURIComponent(c); } catch (e) { /* 인코딩 없이 붙인 주소 그대로 써요 */ } c = c.trim();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 주소창 정리를 못 해도 괜찮아요 */ }
    if (validCode(c)) { setCode(c); ui.msg = ''; setTimeout(function () { toast('제출 코드가 저장됐어요. 3단계에서 시트로 보낼 수 있어요.'); }, 300); }
  })();
  render();
})();
</script>
